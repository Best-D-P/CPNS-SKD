# Nama workflow yang akan muncul di tab Actions pada repository GitHub Anda
name: CI

# Mengatur kapan workflow ini akan dijalankan
on:
  # Menjalankan workflow saat ada push atau pull request ke branch "main"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Memungkinkan Anda menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:

# Hak akses default yang diberikan ke GITHUB_TOKEN (praktik keamanan standar)
permissions:
  contents: read

# Sebuah workflow terdiri dari satu atau beberapa job yang bisa berjalan paralel atau berurutan
jobs:
  # Nama job adalah "build"
  build:
    # Jenis sistem operasi virtual (runner) tempat job akan dijalankan
    runs-on: ubuntu-latest

    # Steps adalah urutan langkah-langkah yang akan dijalankan di dalam job
    steps:
      # Mengambil (checkout) kode repository Anda agar bisa diakses oleh runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Menjalankan satu baris perintah menggunakan shell runner
      - name: Run a one-line script
        run: echo Hello, world!

      # Menjalankan beberapa baris perintah sekaligus
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
